<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>星穹突击队</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="game-wrap" aria-label="星穹突击队游戏区域">
        <canvas id="gameCanvas" width="480" height="720"></canvas>
        <div id="overlay" class="overlay">
          <div class="panel">
            <h1>STAR RAID</h1>
            <p id="overlayText">星穹突击队</p>
            <button id="startButton" type="button" data-action="select">选择机体</button>
          </div>
        </div>
      </section>
      <section class="command-strip" aria-label="操作方式">
        <span>移动 WASD / 方向键 / 拖动</span>
        <span>技能 E / Shift</span>
        <span>炸弹 Space</span>
        <span>暂停 P</span>
        <span>重开 R</span>
      </section>
    </main>
    <script type="module" src="./src/main.js?v=20260604-arcade-upgrade"></script>
  </body>
</html>
